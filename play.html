<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phish Finder</title>
  <!-- Fonts are optional: if the school network blocks Google Fonts, the fallbacks are used. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap">
  <style>
    /* =====================================================
       1. COLORS + BASICS
       ===================================================== */
    :root {
      --ink: #0a2f4f;        /* main text: dark navy */
      --deep: #073b5c;       /* shadows + outlines */
      --sea: #2a8fc4;        /* medium blue */
      --foam: #e6f6ff;       /* very light blue */
      --sand: #fff6df;       /* warm cream */
      --sun: #ffc93c;        /* yellow buttons */
      --coral: #e8453c;      /* phish / red flags */
      --coral-soft: #ffe0dc;
      --kelp: #16955a;       /* safe / correct */
      --kelp-soft: #d9f7e6;
      --shell: #ff8fb1;      /* Shell Mail pink */
      --head: "Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
      --text: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--text);
      font-size: 20px;
      line-height: 1.5;
      color: var(--ink);
      background: #1b84bf;          /* fallback behind the ocean layer */
      overflow-x: hidden;
    }

    h1, h2, h3 { font-family: var(--head); margin: 0; line-height: 1.15; }

    button { font: inherit; color: inherit; }

    /* =====================================================
       2. THE OCEAN BACKGROUND (purely decorative)
       ===================================================== */
    .ocean {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;           /* taps go "through" it */
      overflow: hidden;
      background: linear-gradient(180deg, #9be3ff 0%, #45b6e6 35%, #1b84bf 70%, #0c5a8c 100%);
    }
    .rays {
      position: absolute;
      top: -10%; left: -50%; right: -50%;
      height: 75%;
      background: repeating-linear-gradient(100deg,
        rgba(255,255,255,0.16) 0 40px, transparent 40px 130px);
      filter: blur(8px);
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
              mask-image: linear-gradient(to bottom, #000, transparent);
      animation: rays 9s ease-in-out infinite alternate;
    }
    @keyframes rays { from { transform: translateX(-30px) skewX(-4deg); opacity: .7; }
                      to   { transform: translateX(30px)  skewX(4deg);  opacity: 1; } }

    .bg-bubble {
      position: absolute;
      bottom: -40px;
      left: var(--x);
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.55);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.8), rgba(255,255,255,.1) 35%, transparent 60%);
      animation: rise var(--d) linear var(--delay) infinite;
    }
    @keyframes rise {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(18px, -55vh); }
      100% { transform: translate(-6px, -115vh); }
    }

    /* Cartoon fish swimming across, right to left */
    .swimmer {
      position: absolute;
      left: 100%;
      top: var(--y);
      width: var(--size, 64px);
      opacity: var(--alpha, .85);
      animation: swim var(--d) linear var(--delay) infinite;
    }
    .swimmer svg { display: block; width: 100%; animation: fishbob 1.6s ease-in-out infinite alternate; }
    @keyframes swim {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(calc(-50vw - 60px), 14px); }
      100% { transform: translate(calc(-100vw - 160px), 0); }
    }
    @keyframes fishbob { from { transform: translateY(-3px) rotate(-3deg); } to { transform: translateY(3px) rotate(3deg); } }

    /* Shimmering light patches near the surface */
    .caustics {
      position: absolute;
      inset: 0 -10% 45% -10%;
      opacity: .4;
      background:
        radial-gradient(ellipse 140px 40px at 15% 8%,  rgba(255,255,255,.55), transparent 70%),
        radial-gradient(ellipse 180px 50px at 55% 4%,  rgba(255,255,255,.5),  transparent 70%),
        radial-gradient(ellipse 110px 34px at 85% 12%, rgba(255,255,255,.55), transparent 70%),
        radial-gradient(ellipse 90px 26px  at 35% 18%, rgba(255,255,255,.4),  transparent 70%);
      animation: caustics 7s ease-in-out infinite alternate;
    }
    @keyframes caustics { to { transform: translateX(40px) scaleX(1.1); opacity: .22; } }

    /* The reef along the bottom: an SVG that stretches to fit */
    .reef { position: absolute; left: 0; bottom: 0; width: 100%; height: 240px; }
    .kelp { animation: sway 4.5s ease-in-out infinite alternate; }
    .kelp.k2 { animation-duration: 3.6s; animation-delay: -1.2s; }
    .kelp.k3 { animation-duration: 5.2s; animation-delay: -2.4s; }
    @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

    /* =====================================================
       3. TOP BAR: title, progress, score, mute
       ===================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto auto;
      grid-template-areas: "brand score mute" "progress progress progress";
      gap: 8px 10px;
      align-items: center;
      padding: 10px 16px;
      color: #fff;
      background: rgba(7, 59, 92, 0.6);
      -webkit-backdrop-filter: blur(8px);
              backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
    }
    @media (min-width: 700px) {
      .topbar {
        grid-template-columns: auto 1fr auto auto;
        grid-template-areas: "brand progress score mute";
        padding: 12px 24px;
      }
    }
    .topbar::after {                 /* wavy bottom edge */
      content: "";
      position: absolute;
      left: 0; right: 0; top: 100%;
      height: 12px;
      background: radial-gradient(circle at 20px -8px, rgba(7,59,92,.6) 17px, transparent 17.5px) repeat-x;
      background-size: 40px 12px;
      pointer-events: none;
    }
    .brand { grid-area: brand; font-family: var(--head); font-size: 26px; font-weight: 800; white-space: nowrap; }

    .progress { grid-area: progress; display: flex; align-items: center; gap: 12px; }
    .track {
      position: relative;
      flex: 1;
      height: 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.25);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.25);
    }
    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--sun), #ffe79a);
      transition: width .7s cubic-bezier(.3,1.4,.5,1);
    }
    .track-fish {
      position: absolute;
      top: 50%;
      left: 0%;
      font-size: 28px;
      line-height: 1;
      transform: translate(-50%, -55%) scaleX(-1);   /* flip so the fish faces right */
      transition: left .7s cubic-bezier(.3,1.4,.5,1);
    }
    .progress-label { font-weight: 800; white-space: nowrap; min-width: 4.2em; text-align: right; }

    .score-pill {
      grid-area: score;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      background: var(--sun);
      color: var(--ink);
      font-family: var(--head);
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 4px 0 rgba(0,0,0,.25);
    }
    .mute {
      grid-area: mute;
      width: 52px; height: 52px;
      border: none; border-radius: 50%;
      background: rgba(255,255,255,0.9);
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,.25);
      touch-action: manipulation;
    }

    /* =====================================================
       4. PAGE LAYOUT + SCREEN TRANSITIONS
       ===================================================== */
    main {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 18px 16px 120px;
    }
    #screen:focus { outline: none; }
    #screen.enter { animation: screenIn .45s cubic-bezier(.2,1.2,.4,1) both; }
    #screen.leave { animation: screenOut .25s ease-in both; }
    @keyframes screenIn  { from { opacity: 0; transform: translateX(50px) scale(.97); } }
    @keyframes screenOut { to   { opacity: 0; transform: translateX(-50px) scale(.97); } }

    /* A white rounded card used by several screens */
    .card {
      position: relative;
      background: #fff;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 8px 0 var(--deep), 0 18px 40px rgba(0,0,0,.2);
    }

    /* =====================================================
       5. BUTTONS
       ===================================================== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 64px;
      padding: 12px 30px;
      border: none;
      border-radius: 20px;
      background-color: var(--sun);
      background-image: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,0) 55%);  /* shiny top */
      color: var(--ink);
      font-family: var(--head);
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,.28);
      touch-action: manipulation;      /* no double-tap zoom on tablets */
      transition: transform .08s, box-shadow .08s, filter .15s;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
    .btn:focus-visible, .mute:focus-visible, .row:focus-visible {
      outline: 4px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 8px var(--ink);
    }
    .btn:disabled { cursor: default; filter: saturate(.4) opacity(.6); }
    .btn-phish { background-color: var(--coral); color: #fff; }
    .btn-safe  { background-color: var(--kelp);  color: #fff; }
    .btn.glow  { animation: glow 1.4s ease-in-out infinite; }
    /* "Send my score to my teacher": big, green, and a link that looks like a button */
    .btn.send-score {
      width: 100%; max-width: 480px; min-height: 84px;
      background-color: var(--kelp); color: #fff;
      font-size: 30px; line-height: 1.15; text-align: center; text-decoration: none;
    }
    @keyframes glow {
      0%,100% { box-shadow: 0 6px 0 rgba(0,0,0,.28), 0 0 0 0 rgba(255,201,60,.9); }
      50%     { box-shadow: 0 6px 0 rgba(0,0,0,.28), 0 0 0 14px rgba(255,201,60,0); }
    }
    .actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; margin-top: 18px; }
    .actions[hidden] { display: none; }

    /* Phish / Safe: two giant buttons side by side */
    .decide { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
    .decide .btn { flex-direction: column; gap: 0; min-height: 120px; font-size: 30px; border-radius: 26px; }
    .decide .btn .big-emoji { font-size: 46px; line-height: 1.1; }
    .decide.nudge { animation: nudge .5s; }
    @keyframes nudge { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }

    /* =====================================================
       6. CHARACTERS (sender avatar + Ollie the guide)
       Two layers so animations don't fight:
         .char  = reaction layer (cheer, shake, sad...)
         .idle  = always-on move from emails.js (bounce, wiggle...)
       ===================================================== */
    .char {
      flex-shrink: 0;
      display: grid; place-items: center;
      width: 104px; height: 104px;
      border-radius: 50%;
      /* a brass ship's porthole with water inside */
      background: radial-gradient(circle at 50% 30%, #f2fbff, #c4eafc 55%, #8ed0f2);
      border: 6px solid #f4c45a;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.75), 0 0 0 3px #b98a1f, 0 8px 18px rgba(7,59,92,.35);
      font-size: 62px;
      line-height: 1;
    }
    .char .idle { display: grid; place-items: center; }
    .char.has-svg { padding: 5px; }            /* holds an SVG from characters.js */
    .char.has-svg .cc { width: 100%; height: 100%; }
    /* Ollie stands free, without a porthole */
    .char.ollie, .char.hero { background: none; border: none; box-shadow: none; padding: 0; }

    .move-bounce { animation: bounce 1s ease-in-out infinite; }
    .move-wiggle { animation: wiggle .6s ease-in-out infinite; }
    .move-float  { animation: float 3s ease-in-out infinite; }
    .move-spin   { animation: spin 4s linear infinite; }
    .move-puff   { animation: puff 1.4s ease-in-out infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes wiggle { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
    @keyframes float  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(5deg); } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes puff   { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }

    .react-cheer { animation: cheer .9s ease-out; }
    .react-shake { animation: shake .5s ease-in-out; }
    .react-sad   { animation: sad 1s ease-in-out; }
    .react-hop   { animation: hop .45s ease-out; }
    .react-bump  { animation: bump .35s ease-out; }
    @keyframes cheer {
      0%   { transform: translateY(0) scale(1); }
      30%  { transform: translateY(-30px) scale(1.18) rotate(-10deg); }
      55%  { transform: translateY(0) scale(.94) rotate(8deg); }
      75%  { transform: translateY(-12px) scale(1.05) rotate(-4deg); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0) rotate(0); }
      15% { transform: translateX(-12px) rotate(-8deg); }
      35% { transform: translateX(12px)  rotate(8deg); }
      55% { transform: translateX(-8px)  rotate(-5deg); }
      75% { transform: translateX(8px)   rotate(5deg); }
    }
    @keyframes sad {
      0%,100% { transform: translateY(0) rotate(0); }
      35% { transform: translateY(10px) rotate(-12deg) scale(.95); }
      65% { transform: translateY(10px) rotate(10deg)  scale(.95); }
    }
    @keyframes hop  { 40% { transform: translateY(-14px); } }
    @keyframes bump { 40% { transform: scale(1.25); } }

    /* Ollie + speech bubble */
    .guide { display: flex; align-items: flex-end; gap: 12px; margin-top: 18px; }
    .guide .char { width: 112px; height: 112px; font-size: 50px; margin-bottom: -8px; }
    .bubble {
      position: relative;
      flex: 1;
      min-height: 84px;
      padding: 14px 18px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 6px 0 var(--deep);
    }
    .bubble::before {            /* the little tail pointing at Ollie */
      content: "";
      position: absolute;
      left: -12px; bottom: 22px;
      border: 12px solid transparent;
      border-left: 0;
      border-right-color: #fff;
    }
    .say { margin: 0; font-family: var(--head); font-size: 24px; font-weight: 800; line-height: 1.25; }
    .why {
      margin: 10px 0 0;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--foam);
      font-size: 19px;
      font-weight: 700;
    }
    .why.flag { background: var(--coral-soft); color: #8c1a10; }
    .why.fine { background: var(--kelp-soft);  color: #0c5c33; }
    .bubble.pop { animation: bubblePop .3s ease-out; }
    @keyframes bubblePop { from { transform: scale(.94); } }

    /* =====================================================
       7. START SCREEN
       ===================================================== */
    .start { text-align: center; padding-top: 30px; }
    .logo {
      font-size: clamp(44px, 11vw, 76px);
      font-weight: 800;
      color: var(--sea);
      /* outline made from 4 shadows + a drop shadow (cleaner than text-stroke) */
      text-shadow: 2px 0 0 var(--deep), -2px 0 0 var(--deep), 0 2px 0 var(--deep), 0 -2px 0 var(--deep), 0 6px 0 var(--deep);
    }
    .logo span { display: inline-block; animation: wave 2s ease-in-out infinite; animation-delay: calc(var(--i) * .08s); }
    @keyframes wave { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-12px); } }
    .start .char, .end .char { margin: 0 auto 6px; width: 170px; height: 170px; font-size: 78px; }
    .end .char { width: 120px; height: 120px; margin-bottom: -6px; }
    .hello { font-size: 22px; margin: 10px 0 18px; }
    .how { list-style: none; padding: 0; margin: 0 auto 22px; max-width: 520px; text-align: left; display: grid; gap: 10px; }
    .how li { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 18px; background: var(--foam); font-weight: 700; }
    .how .ico { font-size: 34px; }

    /* =====================================================
       8. SHELL MAIL APP (inbox + email view)
       ===================================================== */
    .app { padding: 0; overflow: hidden; }
    .app-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      position: relative;
      padding: 12px 20px;
      background: #ff9fb6;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.45);
      color: #5a1030;
      font-family: var(--head);
      font-weight: 800;
      font-size: 22px;
    }
    .app-bar::after {                /* scalloped shell edge */
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -9px;
      height: 10px;
      z-index: 1;
      background: radial-gradient(circle at 10px 0, #ff9fb6 9px, transparent 9.5px) repeat-x;
      background-size: 20px 10px;
    }
    .app-bar .chip { background: rgba(255,255,255,.75); padding: 2px 14px; border-radius: 999px; font-size: 18px; }

    /* Inbox */
    .inbox { list-style: none; margin: 0; padding: 16px 8px 8px; }
    .row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      min-height: 76px;
      padding: 10px 12px;
      margin: 0;
      border: none;
      border-radius: 18px;
      background: transparent;
      text-align: left;
      cursor: default;
      touch-action: manipulation;
    }
    .inbox li + li { border-top: 2px dashed #e6eef3; }
    .row .r-avatar { width: 56px; height: 56px; display: grid; place-items: center; font-size: 38px; }
    .row .r-avatar .cc { width: 56px; height: 56px; }
    .row:not(.current) .cc * { animation-play-state: paused; }   /* only the NEW one moves */
    .row .r-from, .row .r-subject { display: block; }
    .row .r-from { font-weight: 800; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .r-subject { font-size: 17px; color: #45627a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .r-text { min-width: 0; }
    .row .r-tag { font-family: var(--head); font-weight: 800; font-size: 18px; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
    .row.done   { opacity: .75; }
    .row.done .r-tag { background: var(--foam); }
    .row.later  { opacity: .45; }
    .row.current {
      cursor: pointer;
      background: #fff7d1;
      box-shadow: inset 0 0 0 3px var(--sun);
      animation: rowIn .6s cubic-bezier(.2,1.4,.4,1) both;
    }
    .row.current .r-tag { background: var(--coral); color: #fff; animation: puff 1.2s ease-in-out infinite; }
    .row.current:active { transform: scale(.98); }
    @keyframes rowIn { from { transform: translateX(60px); opacity: 0; } }

    /* Email view */
    .mail-inner { padding: 26px 22px 24px; }
    .mail-head { display: flex; gap: 16px; align-items: center; padding-bottom: 14px; border-bottom: 3px dashed #e6eef3; }
    .meta { min-width: 0; flex: 1; }
    .meta-line { font-size: 18px; overflow-wrap: anywhere; }
    .meta-line + .meta-line { margin-top: 4px; }
    .label {
      display: inline-block;
      min-width: 56px;
      margin-right: 6px;
      padding: 0 8px;
      border-radius: 8px;
      background: var(--foam);
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: .5px;
      text-align: center;
    }
    .from { font-weight: 800; }
    .subject { font-size: clamp(24px, 4.6vw, 30px); margin: 16px 0 10px; overflow-wrap: anywhere; }
    .mail-body { font-size: 21px; line-height: 1.85; overflow-wrap: anywhere; }
    .mail-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 22px;
      border-radius: 16px;
      background: var(--sea);
      color: #fff;
      font-weight: 800;
      font-size: 21px;
      box-shadow: 0 5px 0 #0d5f91;
    }

    /* Verdict stamp that slams onto the email */
    .mail.stamped .mail-inner { padding-bottom: 96px; }
    .stamp {
      position: absolute;
      right: 22px; bottom: 20px;
      padding: 2px 18px;
      border: 5px solid currentColor;
      border-radius: 14px;
      background: rgba(255,255,255,.9);
      font-family: var(--head);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2px;
      pointer-events: none;
      transform: rotate(-10deg);
      animation: stamp .45s cubic-bezier(.3,1.6,.5,1) both;
    }
    .stamp.phish { color: var(--coral); }
    .stamp.safe  { color: var(--kelp); }
    @keyframes stamp { from { opacity: 0; transform: rotate(-10deg) scale(3); } }

    /* =====================================================
       9. TAPPABLE SPOTS
       ===================================================== */
    .spot {
      border-radius: 8px;
      padding: 2px 3px;
      -webkit-box-decoration-break: clone;
              box-decoration-break: clone;   /* keeps the highlight nice across line breaks */
      transition: background-color .2s, color .2s;
      touch-action: manipulation;
    }
    .hunting .spot {
      cursor: pointer;
      background: rgba(42,143,196,.13);
      border-bottom: 3px dotted var(--sea);
    }
    .mail-btn .spot { background: none; border-bottom-color: #fff; }
    .hunting .spot:hover { background: rgba(42,143,196,.28); }
    .spot:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    .spot.is-flag, .mail-btn .spot.is-flag {
      background: var(--coral-soft);
      color: #9e1c12;
      border-bottom: 3px solid var(--coral);
      font-weight: 800;
    }
    .spot.is-flag::after { content: " 🚩"; }
    .spot.is-fine, .mail-btn .spot.is-fine {
      background: var(--kelp-soft);
      color: #0c6236;
      border-bottom: 3px solid var(--kelp);
    }
    .spot.is-fine::after { content: " 👍"; }
    .spot.is-missed {
      outline: 3px dashed var(--coral);
      outline-offset: 2px;
      animation: missed 1.2s ease-in-out infinite;
    }
    @keyframes missed { 50% { background-color: var(--coral-soft); } }

    /* Red flag counter: 🚩 🚩 🚩 */
    .pips { display: flex; gap: 6px; font-size: 30px; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.9); }
    .pips span { transition: filter .3s, opacity .3s, transform .3s; }
    .pips .off { filter: grayscale(1); opacity: .3; }
    .pips .on  { animation: hop .45s ease-out; }

    /* =====================================================
       10. END SCREEN
       ===================================================== */
    .end { text-align: center; }
    .medal {
      width: 170px; height: 170px;
      margin: 14px auto 8px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff6c9, var(--sun) 60%, #e8a100);
      border: 6px solid #fff;
      box-shadow: 0 8px 0 #b37b00, 0 0 0 10px rgba(255,201,60,.35);
      font-size: 92px;
      animation: medalIn 1s cubic-bezier(.2,1.5,.4,1) both .2s;
    }
    @keyframes medalIn { from { opacity: 0; transform: scale(.2) rotate(-180deg); } }
    .badge-name { font-size: 36px; color: var(--sea); }
    .final { font-family: var(--head); font-size: 30px; font-weight: 800; margin: 6px 0 14px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 16px; }
    .stat { padding: 12px; border-radius: 18px; background: var(--foam); font-weight: 700; }
    .stat b { display: block; font-family: var(--head); font-size: 32px; }
    .shark {
      display: flex; gap: 14px; align-items: center; text-align: left;
      padding: 14px 18px; margin-bottom: 16px;
      border-radius: 20px;
      background: linear-gradient(90deg, #0c5a8c, #2a8fc4);
      color: #fff;
      animation: screenIn .6s both 1s;
    }
    .shark .big { font-size: 56px; }
    .remember { padding: 14px; border-radius: 18px; background: var(--sand); font-weight: 800; font-size: 22px; }

    /* =====================================================
       10b. SPICE: streak, hype words, net, Phish Tank, final round
       ===================================================== */
    /* 🔥 streak chip inside the score pill */
    .streak {
      display: inline-flex; align-items: center;
      margin-left: 6px; padding: 0 10px;
      border-radius: 999px;
      background: linear-gradient(#ff9a3d, #ff4d4d);
      color: #fff;
      font-size: 20px;
    }
    .streak.hot { animation: flame .6s ease-in-out infinite alternate; }
    @keyframes flame { from { box-shadow: 0 0 0 0 rgba(255,120,40,.8); } to { box-shadow: 0 0 16px 5px rgba(255,120,40,.8); } }

    /* 💥 big pun words that pop in the middle of the screen */
    .hype {
      position: fixed; left: 50%; top: 40%; z-index: 60;
      width: min(92vw, 720px);
      pointer-events: none;
      text-align: center;
      font-family: var(--head); font-weight: 800;
      transform: translate(-50%, -50%);
      animation: hype 1.4s cubic-bezier(.2,1.4,.4,1) both;
    }
    .hype .big {
      display: block;
      font-size: clamp(42px, 11vw, 84px);
      line-height: 1.05;
      color: var(--sun);
      text-shadow: 3px 0 0 var(--deep), -3px 0 0 var(--deep), 0 3px 0 var(--deep), 0 -3px 0 var(--deep), 0 9px 0 var(--deep);
    }
    .hype.cool .big { color: #bfeaff; }
    .hype .small {
      display: inline-block; margin-top: 10px; padding: 4px 18px;
      border-radius: 999px; background: var(--coral); color: #fff;
      font-size: 24px; box-shadow: 0 4px 0 var(--deep);
    }
    @keyframes hype {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); }
      18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(3deg); }
      28%  { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
      78%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -75%) scale(.9); }
    }
    .hype.calm { animation: none !important; }

    /* the email card jolts when you find a red flag */
    .mail.jolt { animation: jolt .3s ease-in-out; }
    @keyframes jolt { 25% { transform: translate(-5px, 2px) rotate(-.4deg); } 50% { transform: translate(5px, -2px) rotate(.4deg); } 75% { transform: translate(-3px, 0); } }

    /* 🥅 the net that drops onto a caught phisher */
    .char { position: relative; }
    .net {
      position: absolute; inset: -10px;
      width: calc(100% + 20px); height: calc(100% + 20px);
      overflow: visible;
      pointer-events: none;
      animation: netDrop .65s cubic-bezier(.3,1.5,.5,1) both;
    }
    @keyframes netDrop { from { transform: translateY(-170%) rotate(-25deg); opacity: 0; } 50% { opacity: 1; } }
    .caught-tag {
      position: absolute; left: 50%; bottom: -16px;
      padding: 0 10px; border-radius: 8px;
      background: var(--coral); color: #fff;
      font-family: var(--head); font-weight: 800; font-size: 15px; letter-spacing: 1px;
      white-space: nowrap;
      box-shadow: 0 3px 0 var(--deep);
      transform: translateX(-50%) rotate(-5deg);
      animation: tagIn .4s .5s cubic-bezier(.3,1.6,.5,1) both;
    }
    @keyframes tagIn { from { opacity: 0; transform: translateX(-50%) scale(2.6) rotate(-5deg); } }

    /* 🐠 the Phish Tank: every phisher you catch swims here */
    .tank {
      position: relative;
      height: 160px;
      margin-bottom: 20px;
      border-radius: 28px;
      overflow: hidden;
      border: 5px solid #fff;
      background: linear-gradient(180deg, #8fe0ff, #2a9fd6 75%);
      box-shadow: 0 8px 0 var(--deep), inset 0 0 40px rgba(255,255,255,.35);
    }
    .tank::before {                  /* glass shine */
      content: ""; position: absolute; top: 10px; left: 8%; width: 30%; height: 14px;
      border-radius: 999px; background: rgba(255,255,255,.45); z-index: 2;
    }
    .tank::after {                   /* sand */
      content: ""; position: absolute; left: -5%; right: -5%; bottom: -6px; height: 30px;
      background: #f2d49b; border-radius: 50% 50% 0 0 / 14px 14px 0 0;
    }
    .tank-label {
      position: absolute; right: 14px; top: 8px; z-index: 3;
      padding: 2px 14px; border-radius: 999px;
      background: rgba(7,59,92,.7); color: #fff;
      font-family: var(--head); font-weight: 800; font-size: 18px;
    }
    .tank-empty {
      position: absolute; inset: 0; z-index: 3;
      display: grid; place-items: center;
      padding: 0 20px; text-align: center;
      color: #fff; font-weight: 800; font-size: 20px;
      text-shadow: 0 2px 0 var(--deep);
    }
    .tank-fish {
      position: absolute; z-index: 1;
      width: 64px; height: 64px;
      top: var(--top); left: var(--left);
      animation: tankSwim var(--d) linear var(--delay) infinite;
    }
    .tank-fish.new { --left: 3%; animation: plop 1s cubic-bezier(.3,1.4,.5,1) both, tankSwim var(--d) linear 1s infinite; }
    @keyframes tankSwim {
      0%   { left: 3%; transform: scaleX(-1); }
      47%  { left: calc(97% - 64px); transform: scaleX(-1); }
      50%  { left: calc(97% - 64px); transform: scaleX(1); }
      97%  { left: 3%; transform: scaleX(1); }
      100% { left: 3%; transform: scaleX(-1); }
    }
    @keyframes plop { from { transform: translateY(-180px) rotate(-30deg); } 60% { transform: translateY(10px); } to { transform: none; } }
    .tank-bubble {
      position: absolute; bottom: 20px; z-index: 0;
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.7);
      animation: tankBubble 3s ease-in infinite;
    }
    @keyframes tankBubble { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-140px); opacity: 0; } }

    /* ⚡ FINAL ROUND intro for the last email */
    .boss {
      position: fixed; inset: 0; z-index: 70;
      display: grid; place-items: center;
      padding: 16px; text-align: center;
      background: radial-gradient(circle at 50% 45%, rgba(255,80,60,.55), rgba(5,20,40,.94) 65%);
      color: #fff; cursor: pointer;
      animation: fadeIn .3s ease-out both;
    }
    .boss .b-char { width: 170px; height: 170px; margin: 0 auto 6px; }
    .boss h2 { font-size: clamp(44px, 11vw, 84px); color: var(--sun); text-shadow: 0 6px 0 #8c1a10; animation: bossShake .5s ease-in-out 3; }
    .boss p  { max-width: 520px; margin: 10px auto 0; font-size: 22px; font-weight: 800; }
    .boss .tap { opacity: .75; font-size: 16px; margin-top: 18px; }
    .boss.out { animation: fadeOut .35s ease-in both; }
    @keyframes fadeIn  { from { opacity: 0; } }
    @keyframes fadeOut { to   { opacity: 0; } }
    @keyframes bossShake {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-7px, 2px) rotate(-2deg); }
      40% { transform: translate(7px, -2px) rotate(2deg); }
      60% { transform: translate(-4px, 0); }
      80% { transform: translate(4px, 0); }
    }
    .ocean { transition: filter 1s; }
    body.final-round .ocean { filter: hue-rotate(-25deg) saturate(1.3) brightness(.72); }

    .stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) !important; }
    .guide-title { font-size: 26px; margin: 4px 0 10px; color: var(--sea); }

    /* =====================================================
       10c. FIELD GUIDE (trick stickers) + talking tank fish
       ===================================================== */
    .trick-card {
      position: fixed; left: 50%; bottom: 24px; z-index: 65;
      display: flex; align-items: center; gap: 14px;
      width: min(92vw, 520px);
      padding: 14px 18px;
      border-radius: 22px;
      background: #fff; color: var(--ink);
      border: 4px solid var(--sun);
      box-shadow: 0 8px 0 var(--deep), 0 20px 40px rgba(0,0,0,.3);
      transform: translateX(-50%);
      animation: cardUp .5s cubic-bezier(.2,1.4,.4,1) both;
    }
    .trick-card.out { animation: cardDown .35s ease-in both; }
    @keyframes cardUp   { from { transform: translate(-50%, 140%) rotate(-4deg); } }
    @keyframes cardDown { to   { transform: translate(-50%, 140%); opacity: 0; } }
    .trick-card .t-icon { font-size: 48px; animation: hop .6s .3s ease-out; }
    .trick-card .t-new  { font-family: var(--head); font-weight: 800; font-size: 15px; color: var(--coral); letter-spacing: 1px; }
    .trick-card .t-name { font-family: var(--head); font-weight: 800; font-size: 24px; line-height: 1.1; }
    .trick-card .t-tip  { font-size: 16px; font-weight: 700; color: #45627a; }

    .fieldguide {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin: -6px 0 20px;
      padding: 10px 14px;
      border-radius: 22px;
      background: rgba(7,59,92,.55);
      color: #fff;
    }
    .fg-label { font-family: var(--head); font-weight: 800; font-size: 20px; margin-right: 4px; }
    .fg-badge {
      width: 48px; height: 48px;
      display: grid; place-items: center;
      border: none; border-radius: 14px;
      background: #fff;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--deep);
      touch-action: manipulation;
    }
    .fg-badge.locked { background: rgba(255,255,255,.25); box-shadow: none; filter: grayscale(1); opacity: .55; }
    .fg-badge:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }

    .guide-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0 0 16px; text-align: left; }
    .g-card { padding: 12px; border-radius: 18px; background: var(--foam); }
    .g-card .g-top { display: flex; align-items: center; gap: 8px; font-family: var(--head); font-weight: 800; font-size: 19px; line-height: 1.1; }
    .g-card .g-top span:first-child { font-size: 30px; }
    .g-card p { margin: 6px 0 0; font-size: 15px; font-weight: 700; color: #45627a; }
    .g-card.locked { background: #eef2f5; color: #9aa9b5; }
    .g-card.locked p { color: #9aa9b5; }

    .tank-fish { cursor: pointer; touch-action: manipulation; }
    .tank-talk {
      position: absolute; z-index: 4;
      max-width: 230px;
      padding: 8px 12px;
      border-radius: 16px;
      background: #fff; color: var(--ink);
      font-weight: 800; font-size: 16px; line-height: 1.25;
      box-shadow: 0 4px 0 var(--deep);
      pointer-events: none;
      animation: talkIn .3s cubic-bezier(.3,1.5,.5,1) both;
    }
    .tank-talk small { display: block; margin-top: 4px; color: var(--coral); font-size: 14px; }
    @keyframes talkIn { from { opacity: 0; scale: .6; } }

    /* =====================================================
       11. FLYING EFFECTS (confetti, +10 text)
       ===================================================== */
    .fx {
      position: fixed;
      z-index: 50;
      left: 0; top: 0;
      pointer-events: none;
      font-size: 30px;
      line-height: 1;
    }
    .fx-points {
      font-family: var(--head);
      font-size: 34px;
      font-weight: 800;
      color: #fff;
      -webkit-text-stroke: 1.5px var(--deep);
      text-shadow: 0 3px 0 var(--deep);
      white-space: nowrap;
    }

    /* Screen-reader only text */
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* =====================================================
       12. SMALL SCREENS
       ===================================================== */
    @media (max-width: 520px) {
      body { font-size: 18px; }
      .brand { font-size: 22px; }
      .char { width: 80px; height: 80px; font-size: 48px; }
      .guide .char { width: 84px; height: 84px; font-size: 38px; }
      .mail-inner { padding: 16px; }
      .mail-body { font-size: 19px; }
      .say { font-size: 21px; }
      .decide .btn { min-height: 104px; font-size: 26px; }
      .stats { grid-template-columns: 1fr; }
    }

    /* =====================================================
       13. REDUCED MOTION
       If the device asks for less motion, every animation
       jumps straight to its end, and the ocean stops moving.
       (The JS also skips confetti; see calm().)
       ===================================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .bg-bubble, .swimmer, .rays, .caustics, .tank-bubble { display: none; }
      .tank-fish, .tank-fish.new { animation: none !important; }   /* fish sit still, spread out */
    }
  </style>
</head>
<body>
  <!-- Decorative ocean (bubbles are added by JS) -->
  <div class="ocean" aria-hidden="true">
    <div class="rays"></div>
    <div id="bubbles"></div>
    <div class="caustics"></div>

    <!-- Cartoon fish (SVG). Each faces left because they swim right → left. -->
    <div class="swimmer" style="--y:20%; --d:30s; --delay:-6s; --size:70px;">
      <svg viewBox="0 0 64 40"><path d="M48 20 L63 7 Q58 20 63 33 Z" fill="#ffb347" stroke="#16385a" stroke-width="2" stroke-linejoin="round"/><ellipse cx="28" cy="20" rx="24" ry="15" fill="#ffb347" stroke="#16385a" stroke-width="2"/><path d="M34 7 Q30 20 34 33" fill="none" stroke="#fff" stroke-width="4"/><circle cx="15" cy="16" r="4.5" fill="#fff" stroke="#16385a" stroke-width="1.5"/><circle cx="14" cy="16.5" r="2.4" fill="#16385a"/><path d="M8 25 Q11 27 14 25" fill="none" stroke="#16385a" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div class="swimmer" style="--y:52%; --d:38s; --delay:-22s; --size:84px;">
      <svg viewBox="0 0 64 40"><path d="M48 20 L63 9 Q59 20 63 31 Z" fill="#ff8fb1" stroke="#16385a" stroke-width="2" stroke-linejoin="round"/><path d="M22 6 Q30 0 38 6" fill="#ff8fb1" stroke="#16385a" stroke-width="2"/><ellipse cx="28" cy="20" rx="23" ry="14" fill="#ff8fb1" stroke="#16385a" stroke-width="2"/><circle cx="30" cy="18" r="2" fill="#ffd0de"/><circle cx="38" cy="24" r="2.5" fill="#ffd0de"/><circle cx="15" cy="16" r="4.5" fill="#fff" stroke="#16385a" stroke-width="1.5"/><circle cx="14" cy="16.5" r="2.4" fill="#16385a"/><path d="M8 25 Q11 27 14 25" fill="none" stroke="#16385a" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div class="swimmer" style="--y:72%; --d:46s; --delay:-14s; --size:110px; --alpha:.35;">
      <!-- a far-away school of little fish -->
      <svg viewBox="0 0 110 40" fill="#e6f6ff"><path d="M4 12 q10 -8 20 0 l8 -6 v12 l-8 -6 q-10 8 -20 0z"/><path d="M40 26 q10 -8 20 0 l8 -6 v12 l-8 -6 q-10 8 -20 0z"/><path d="M70 10 q10 -8 20 0 l8 -6 v12 l-8 -6 q-10 8 -20 0z"/></svg>
    </div>

    <!-- The reef. preserveAspectRatio "slice" fills the width and keeps the middle on phones. -->
    <svg class="reef" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax slice">
      <path d="M0 150 Q80 110 160 140 T320 128 T480 140 T640 120 T800 138 T960 124 T1120 140 T1200 132 V240 H0 Z" fill="#0d5f91" opacity=".5"/>
      <!-- kelp: a dark wide stroke + a lighter thin stroke on top. Each sways from its base. -->
      <g transform="translate(-20 0)"><g class="kelp" style="transform-origin:90px 240px"><path d="M90 240 C78 200 104 170 90 130 C78 98 100 72 92 40" fill="none" stroke="#1d7a4a" stroke-width="18" stroke-linecap="round"/><path d="M90 240 C78 200 104 170 90 130 C78 98 100 72 92 40" fill="none" stroke="#3cbf74" stroke-width="9" stroke-linecap="round"/></g></g>
      <g transform="translate(30 0)"><g class="kelp k2" style="transform-origin:90px 240px"><path d="M90 240 C80 214 100 196 90 168 C82 148 98 130 92 110" fill="none" stroke="#1d7a4a" stroke-width="16" stroke-linecap="round"/><path d="M90 240 C80 214 100 196 90 168 C82 148 98 130 92 110" fill="none" stroke="#5ad08a" stroke-width="8" stroke-linecap="round"/></g></g>
      <g transform="translate(380 0)"><g class="kelp k3" style="transform-origin:90px 240px"><path d="M90 240 C80 214 100 196 90 168 C82 148 98 130 92 110" fill="none" stroke="#1d7a4a" stroke-width="16" stroke-linecap="round"/><path d="M90 240 C80 214 100 196 90 168 C82 148 98 130 92 110" fill="none" stroke="#5ad08a" stroke-width="8" stroke-linecap="round"/></g></g>
      <g transform="translate(680 0)"><g class="kelp k2" style="transform-origin:90px 240px"><path d="M90 240 C78 200 104 170 90 130 C78 98 100 72 92 40" fill="none" stroke="#1d7a4a" stroke-width="18" stroke-linecap="round"/><path d="M90 240 C78 200 104 170 90 130 C78 98 100 72 92 40" fill="none" stroke="#3cbf74" stroke-width="9" stroke-linecap="round"/></g></g>
      <g transform="translate(990 0)"><g class="kelp" style="transform-origin:90px 240px"><path d="M90 240 C78 200 104 170 90 130 C78 98 100 72 92 40" fill="none" stroke="#1d7a4a" stroke-width="18" stroke-linecap="round"/><path d="M90 240 C78 200 104 170 90 130 C78 98 100 72 92 40" fill="none" stroke="#3cbf74" stroke-width="9" stroke-linecap="round"/></g></g>
      <g transform="translate(1050 0)"><g class="kelp k3" style="transform-origin:90px 240px"><path d="M90 240 C80 214 100 196 90 168 C82 148 98 130 92 110" fill="none" stroke="#1d7a4a" stroke-width="16" stroke-linecap="round"/><path d="M90 240 C80 214 100 196 90 168 C82 148 98 130 92 110" fill="none" stroke="#5ad08a" stroke-width="8" stroke-linecap="round"/></g></g>
      <!-- branching coral -->
      <g fill="none" stroke-linecap="round" stroke-width="11">
        <path transform="translate(180 0)" d="M60 236 L60 196 M60 212 L42 186 M60 204 L80 176 M42 186 L36 166 M42 186 L50 168 M80 176 L74 156 M80 176 L92 160" stroke="#ff6f91"/>
        <path transform="translate(560 6)" d="M60 236 L60 196 M60 212 L42 186 M60 204 L80 176 M42 186 L36 166 M42 186 L50 168 M80 176 L74 156 M80 176 L92 160" stroke="#ff8a5c"/>
        <path transform="translate(900 0)" d="M60 236 L60 196 M60 212 L42 186 M60 204 L80 176 M42 186 L36 166 M42 186 L50 168 M80 176 L74 156 M80 176 L92 160" stroke="#c77dff"/>
      </g>
      <!-- brain coral + rocks -->
      <ellipse cx="420" cy="214" rx="46" ry="26" fill="#f59e4b"/>
      <path d="M386 210 q10 -12 20 0 t20 0 t20 0 t20 0" stroke="#d97a2a" stroke-width="4" fill="none"/>
      <ellipse cx="830" cy="216" rx="40" ry="22" fill="#ffc94d"/>
      <path d="M800 212 q8 -10 16 0 t16 0 t16 0 t16 0" stroke="#e0a21f" stroke-width="4" fill="none"/>
      <ellipse cx="320" cy="222" rx="34" ry="16" fill="#2c6e8f"/>
      <ellipse cx="1000" cy="222" rx="30" ry="14" fill="#2c6e8f"/>
      <!-- sand -->
      <path d="M0 206 Q150 186 300 202 T600 198 T900 204 T1200 196 V240 H0 Z" fill="#f2d49b"/>
      <path d="M0 224 Q200 210 400 222 T800 218 T1200 224 V240 H0 Z" fill="#e8c27f"/>
      <!-- starfish + shell on the sand -->
      <polygon points="560,202 562.9,210 571.4,210.3 564.8,215.5 567.1,223.7 560,219 552.9,223.7 555.2,215.5 548.6,210.3 557.1,210" fill="#ff8a5c" stroke="#d9603a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M686 224 Q700 202 714 224 Z M700 224 L700 208 M693 224 L696 210 M707 224 L704 210" fill="#ffc2d1" stroke="#e98aa5" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </div>

  <header class="topbar">
    <div class="brand">🎣 Phish Finder</div>
    <div class="progress" id="progress" role="progressbar" aria-label="Emails finished" aria-valuemin="0" aria-valuenow="0">
      <div class="track">
        <div class="fill" id="progressFill"></div>
        <span class="track-fish" id="progressFish" aria-hidden="true">🐟</span>
      </div>
      <span class="progress-label" id="progressLabel">0 / 0</span>
    </div>
    <div class="score-pill" id="scorePill" aria-live="polite">⭐ <span id="score">0</span><span class="sr"> points</span><span class="streak" id="streak" hidden></span></div>
    <button class="mute" id="mute" aria-label="Sound on" aria-pressed="false">🔊</button>
  </header>

  <main>
    <div id="screen" tabindex="-1"></div>
  </main>

  <script src="emails.js"></script>
  <script src="characters.js"></script>
  <script src="tricks.js"></script>
  <script src="nicknames.js"></script>
  <script>
    // =====================================================
    // SEND-MY-SCORE GOOGLE FORM
    // Paste your form's link and its entry IDs here (see README.md).
    // While url is "", the "Send my score" button stays hidden.
    // =====================================================
    const SCORE_FORM = {
      url: "https://docs.google.com/forms/d/e/1FAIpQLSdsp4cL4RmTXrUoaxtSiCvIhEXRCumr5PebDbRIHtTqNXDP0Q/viewform",
      nickname: "entry.1182842989",
      score: "entry.2123893282",
      badge: "entry.1623426616",
      missed: "entry.1398642686",
      class: "entry.823893650"      // from ?class=... in the link (or ?teacher=...), else left blank
    };

    // =====================================================
    // SETTINGS
    // The defaults below are used unless the link has school settings, like
    //   play.html?school=Coral%20Reef%20Elementary&domain=coralreef-school.edu&teacher=Ms.%20Coral
    // (index.html passes these along for you.)
    // =====================================================
    const DEFAULTS = {
      schoolDomain: "coralreef-school.edu",
      teacherName: "Ms. Coral",
      schoolName: "Coral Reef School"
    };
    const pageParams = new URLSearchParams(location.search);   // the part after "?"

    const settings = {
      nickname: savedNickname(),
      schoolName:   cleanText(pageParams.get("school"), 50)    || DEFAULTS.schoolName,
      teacherName:  cleanText(pageParams.get("teacher"), 40)   || DEFAULTS.teacherName,
      schoolDomain: cleanDomain(pageParams.get("domain"))      || DEFAULTS.schoolDomain,
      // For the score form only. No default, so made-up names never land on a real form.
      className:    cleanText(pageParams.get("class"), 40)     || cleanText(pageParams.get("teacher"), 40)
    };

    // Names: plain text, trimmed, no invisible control characters, and
    // not too long. (They're only ever shown with textContent, so even
    // "<b>" would show up as the letters < b >, never as real HTML.)
    function cleanText(value, maxLength) {
      if (!value) return "";
      return value
        .replace(/[\u0000-\u001F\u007F]/g, "")   // remove control characters
        .replace(/\s+/g, " ")                    // squash extra spaces
        .trim()
        .slice(0, maxLength)
        .trim();
    }

    // Domains: only letters, numbers, dots, and hyphens, at least one dot,
    // and no dot or hyphen at the very start or end. Anything else → "" (use the default).
    function cleanDomain(value) {
      if (!value) return "";
      const d = value.trim().toLowerCase();
      if (d.length > 60) return "";
      if (!/^[a-z0-9.-]+$/.test(d)) return "";
      if (!d.includes(".")) return "";
      if (/^[.-]|[.-]$/.test(d)) return "";
      return d;
    }

    // The nickname picked on the join page (index.html). We only accept
    // it if it's really on the list in nicknames.js, so nobody can sneak
    // in their own name. Otherwise use a default so testing still works.
    function savedNickname() {
      try {
        const nick = sessionStorage.getItem("phishfinder-nickname");
        if (NICKNAMES.some(n => n.name === nick)) return nick;
      } catch (e) {}
      return "Clever Clownfish";
    }
    // Make a lookalike domain: add an "s" before the first dot.
    // coralreef-school.edu → coralreef-schools.edu
    settings.fakeDomain = settings.schoolDomain.replace(".", "s.");

    const HARD_ONE = "the-hard-one";
    const GUIDE = "🦦";                // Ollie the Otter, our helper

    // =====================================================
    // GAME STATE: everything that changes while playing
    // =====================================================
    const state = {
      index: 0,            // which email we're on
      score: 0,
      phase: "start",      // "decide" → "hunt" → "review"
      found: [],           // spot keys tapped on this email
      emailPoints: 0,      // points earned on this email
      results: [],         // one entry per finished email
      caughtHardOne: false,
      streak: 0,           // correct calls in a row
      bestStreak: 0,
      tricks: []           // trick types found (Field Guide)
    };

    // Shortcuts
    const $ = (sel, root = document) => root.querySelector(sel);
    const screen = $("#screen");
    const scoreEl = $("#score");

    // Does this device want less motion?
    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    const calm = () => motionQuery.matches;

    // =====================================================
    // TEXT HELPERS
    // =====================================================

    // Swap {tags} for real values. "Hi {nickname}" → "Hi Clever Clownfish"
    function fill(text) {
      return text
        .replaceAll("{nickname}", settings.nickname)
        .replaceAll("{schoolDomain}", settings.schoolDomain)
        .replaceAll("{teacherName}", settings.teacherName)
        .replaceAll("{schoolName}", settings.schoolName)
        .replaceAll("{fakeDomain}", settings.fakeDomain);
    }

    // Remove the [[ ]] marks: "Hi [[friend]]" → "Hi friend" (for the inbox list)
    function plain(raw) {
      return fill(raw.replace(/\[\[(.+?)\]\]/g, "$1"));
    }

    // Turn "Claim [[within 1 hour]] now" into normal text + tappable spans.
    // Splitting on [[...]] gives: ["Claim ", "within 1 hour", " now"]
    // Every ODD position is a spot. We only ever use textContent / text
    // nodes, so "<win@krabby-prizez.biz>" shows up as real text.
    function buildText(raw) {
      const frag = document.createDocumentFragment();
      raw.split(/\[\[(.+?)\]\]/).forEach((part, i) => {
        if (i % 2 === 0) {
          frag.append(document.createTextNode(fill(part)));
        } else {
          const span = document.createElement("span");
          span.className = "spot";
          span.textContent = fill(part);
          span.dataset.key = part;          // original key, to look up in spots
          span.setAttribute("role", "button");
          span.tabIndex = -1;               // becomes 0 once hunting starts
          frag.append(span);
        }
      });
      return frag;
    }

    // Build a chunk of page from a template string (only for OUR fixed HTML,
    // never for email text).
    function fromHTML(str) {
      const t = document.createElement("template");
      t.innerHTML = str.trim();
      return t.content;
    }

    const flagCount = email => Object.values(email.spots).filter(s => s.flag).length;
    const flagsFound = email => state.found.filter(k => email.spots[k] && email.spots[k].flag).length;
    const currentEmail = () => emails[state.index];

    // =====================================================
    // SOUNDS: made with the Web Audio API, no sound files!
    // The AudioContext is only created after the first tap
    // (browsers block sound until the player touches something).
    // =====================================================
    const Sound = {
      ctx: null,
      muted: false,
      noiseBuf: null,

      unlock() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!this.ctx) this.ctx = new AC();
        if (this.ctx.state === "suspended") this.ctx.resume();
      },

      // One beep: frequency, start time, length, options
      note(freq, at, dur, { type = "sine", vol = 0.15, slide = null } = {}) {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, at);
        if (slide) osc.frequency.exponentialRampToValueAtTime(slide, at + dur);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(vol, at + 0.02);     // quick fade in
        gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);   // smooth fade out
        osc.connect(gain).connect(ctx.destination);
        osc.start(at);
        osc.stop(at + dur + 0.05);
      },

      // A watery "whoosh": random noise through a sweeping filter
      whoosh(at, dur) {
        const ctx = this.ctx;
        if (!this.noiseBuf) {
          const len = Math.floor(ctx.sampleRate * 0.6);
          this.noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
          const data = this.noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }
        const src = ctx.createBufferSource();
        src.buffer = this.noiseBuf;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.value = 1.2;
        filter.frequency.setValueAtTime(300, at);
        filter.frequency.exponentialRampToValueAtTime(2200, at + dur);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.12, at + dur * 0.4);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        src.connect(filter).connect(gain).connect(ctx.destination);
        src.start(at);
        src.stop(at + dur);
      },

      play(name) {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime + 0.01;
        const n = (freq, delay, dur, opts) => this.note(freq, t + delay, dur, opts);
        switch (name) {
          case "pop":     n(500, 0, .12, { slide: 900, vol: .18 }); break;
          case "blip":    n(660, 0, .1, { type: "triangle" }); n(880, .07, .14, { type: "triangle" }); break;
          case "correct": [523, 659, 784, 1047].forEach((f, i) => n(f, i * .08, .28, { type: "triangle", vol: .2 })); break;
          case "wrong":   n(330, 0, .25, { type: "sawtooth", vol: .05, slide: 230 });
                          n(250, .22, .4, { type: "sawtooth", vol: .05, slide: 150 }); break;
          case "flag":    n(200, 0, .18, { type: "square", vol: .06, slide: 700 }); n(1047, .14, .18, { vol: .15 }); break;
          case "allFound":[784, 988, 1175, 1568, 1319, 1568].forEach((f, i) => n(f, i * .07, .2, { vol: .12 })); break;
          case "mail":    n(988, 0, .18, { vol: .15 }); n(1319, .14, .35, { vol: .15 }); break;
          case "stamp":   n(140, 0, .18, { type: "triangle", vol: .35, slide: 60 }); break;
          case "whoosh":  this.whoosh(t, .45); break;
          case "streak":  [659, 784, 988, 1319].forEach((f, i) => n(f, i * .05, .12, { type: "square", vol: .05 })); break;
          case "net":     this.whoosh(t, .3); n(170, .28, .2, { type: "triangle", vol: .3, slide: 70 }); break;
          case "fizzle":  n(700, 0, .4, { vol: .1, slide: 160 }); break;
          case "plop":    n(280, 0, .14, { slide: 900, vol: .2 }); n(500, .12, .12, { slide: 1300, vol: .12 }); break;
          case "boss":    n(55, 0, 1.4, { type: "sawtooth", vol: .09, slide: 42 });
                          [[392, .15], [370, .45], [349, .75]].forEach(([f, d]) => n(f, d, .28, { type: "square", vol: .06 }));
                          n(330, 1.05, .7, { type: "square", vol: .06 }); break;
          case "fanfare": [[523,0,.14],[659,.15,.14],[784,.3,.14],[1047,.45,.45],[784,.8,.14],[1047,.95,.8]]
                            .forEach(([f, d, len]) => n(f, d, len, { type: "triangle", vol: .2 })); break;
        }
      }
    };

    // Mute button (remembered on this device if storage is allowed)
    const muteBtn = $("#mute");
    try { Sound.muted = localStorage.getItem("phishfinder-muted") === "1"; } catch (e) {}
    function showMute() {
      muteBtn.textContent = Sound.muted ? "🔇" : "🔊";
      muteBtn.setAttribute("aria-pressed", String(Sound.muted));
      muteBtn.setAttribute("aria-label", Sound.muted ? "Sound off. Tap to turn on" : "Sound on. Tap to turn off");
    }
    muteBtn.addEventListener("click", () => {
      Sound.muted = !Sound.muted;
      try { localStorage.setItem("phishfinder-muted", Sound.muted ? "1" : "0"); } catch (e) {}
      Sound.unlock();
      Sound.play("pop");
      showMute();
    });
    showMute();

    // =====================================================
    // EFFECTS: reactions, confetti, floating points
    // =====================================================

    // Restart a CSS animation class on an element (cheer, shake, sad...)
    function react(el, kind) {
      if (!el) return;
      el.classList.remove("react-cheer", "react-shake", "react-sad", "react-hop", "react-bump");
      void el.offsetWidth;                  // trick: forces the browser to restart the animation
      el.classList.add("react-" + kind);
      el.addEventListener("animationend", () => el.classList.remove("react-" + kind), { once: true });
    }

    // Put a character into a circle. Uses the animated SVG from
    // characters.js when there is one, otherwise the emoji.
    function putCharacter(holder, id, emoji, move) {
      if (!holder) return;
      const svg = typeof makeCharacter === "function" ? makeCharacter(id) : null;
      if (svg) {
        holder.classList.add("has-svg");
        holder.append(svg);
      } else {
        const idle = document.createElement("div");
        idle.className = "idle" + (move ? " move-" + move : "");
        idle.textContent = emoji;
        holder.append(idle);
      }
    }

    // Make a character react: "happy" (bounce + smile) or "oops" (shake + worried).
    function mood(holder, kind) {
      if (!holder) return;
      const svg = holder.querySelector(".cc");
      if (svg) characterReact(svg, kind);
      else react(holder, kind === "happy" ? "cheer" : "shake");   // emoji fallback
    }

    function centerOf(el) {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    // Burst of emoji flying out from an element
    function burst(el, pics, count = 12) {
      if (calm() || !el) return;
      const { x, y } = centerOf(el);
      for (let i = 0; i < count; i++) {
        const p = document.createElement("span");
        p.className = "fx";
        p.textContent = pics[i % pics.length];
        document.body.append(p);
        const angle = Math.random() * Math.PI * 2;
        const dist = 70 + Math.random() * 110;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist - 40;
        // Web Animations API: animate from point A to point B in JS
        p.animate([
          { transform: `translate(${x}px, ${y}px) translate(-50%, -50%) scale(.4)`, opacity: 1 },
          { transform: `translate(${x + dx}px, ${y + dy}px) translate(-50%, -50%) scale(1.1) rotate(${dx}deg)`, opacity: 1, offset: .7 },
          { transform: `translate(${x + dx}px, ${y + dy + 40}px) translate(-50%, -50%) scale(.8)`, opacity: 0 }
        ], { duration: 900 + Math.random() * 400, easing: "cubic-bezier(.2,.8,.3,1)" })
          .onfinish = () => p.remove();
      }
    }

    // Lots of fish and stars raining down (end screen)
    function confettiRain() {
      if (calm()) return;
      const pics = ["🐠", "🐟", "⭐", "🫧", "🐚", "🎉", "✨"];
      for (let i = 0; i < 40; i++) {
        const p = document.createElement("span");
        p.className = "fx";
        p.textContent = pics[i % pics.length];
        p.style.fontSize = (24 + Math.random() * 22) + "px";
        document.body.append(p);
        const x = Math.random() * window.innerWidth;
        const drift = (Math.random() - .5) * 160;
        p.animate([
          { transform: `translate(${x}px, -60px) rotate(0)` },
          { transform: `translate(${x + drift}px, ${window.innerHeight + 60}px) rotate(${drift * 3}deg)` }
        ], { duration: 2400 + Math.random() * 2000, delay: Math.random() * 1200, easing: "ease-in", fill: "backwards" })
          .onfinish = () => p.remove();
      }
    }

    // "+10" floating up from where you tapped
    function floatPoints(el, text) {
      const { x, y } = centerOf(el);
      const p = document.createElement("span");
      p.className = "fx fx-points";
      p.textContent = text;
      document.body.append(p);
      const rise = calm() ? 0 : -80;       // in calm mode it fades in place
      p.animate([
        { transform: `translate(${x}px, ${y}px) translate(-50%, -50%) scale(.6)`, opacity: 0 },
        { transform: `translate(${x}px, ${y + rise * .4}px) translate(-50%, -50%) scale(1.15)`, opacity: 1, offset: .25 },
        { transform: `translate(${x}px, ${y + rise}px) translate(-50%, -50%) scale(1)`, opacity: 0 }
      ], { duration: 1200, easing: "ease-out" }).onfinish = () => p.remove();
    }

    // Score counts up instead of jumping
    let shownScore = 0, scoreRaf = 0;
    function showScore() {
      cancelAnimationFrame(scoreRaf);
      const from = shownScore, to = state.score;
      if (calm() || from === to) { shownScore = to; scoreEl.textContent = to; return; }
      const t0 = performance.now();
      const step = now => {
        const k = Math.max(0, Math.min(1, (now - t0) / 500));
        shownScore = Math.round(from + (to - from) * k);
        scoreEl.textContent = shownScore;
        if (k < 1) scoreRaf = requestAnimationFrame(step);
      };
      scoreRaf = requestAnimationFrame(step);
      react($("#scorePill"), "bump");
    }

    function addPoints(n, fromEl, label) {
      state.score += n;
      state.emailPoints += n;
      floatPoints(fromEl, label || "+" + n);
      showScore();
    }

    // Progress bar: how many emails are finished
    function showProgress() {
      const done = state.results.length;
      const total = emails.length;
      const pct = total ? (done / total) * 100 : 0;
      $("#progressFill").style.width = pct + "%";
      $("#progressFish").style.left = pct + "%";
      $("#progressLabel").textContent = `${done} / ${total}`;
      const bar = $("#progress");
      bar.setAttribute("aria-valuemax", total);
      bar.setAttribute("aria-valuenow", done);
    }

    // Ollie talks. Optional tip = { text, kind: "flag" | "fine" }
    function say(text, tip) {
      const bubble = $(".bubble");
      if (!bubble) return;
      $(".say", bubble).textContent = text;
      const why = $(".why", bubble);
      if (tip) {
        why.hidden = false;
        why.className = "why " + (tip.kind || "");
        why.textContent = tip.text;
      } else {
        why.hidden = true;
      }
      bubble.classList.remove("pop");
      void bubble.offsetWidth;
      bubble.classList.add("pop");
    }

    // =====================================================
    // TEACHER UPDATES
    // The lite version has no live teacher screen, so this does nothing.
    // The game still calls it (join, answer, catch, flags, finish), so a
    // future version can plug something in here without touching the game.
    // =====================================================
    function sendToTeacher(event) {}

    // =====================================================
    // SEND MY SCORE (Google Form link)
    // Builds a link like:
    //   https://docs.google.com/forms/d/e/.../viewform?usp=pp_url&entry.111=Cool+Crab&entry.222=230...
    // URLSearchParams encodes spaces, emojis, "&", etc. so nothing breaks the link.
    // Returns "" if the form isn't set up yet.
    // =====================================================
    function scoreFormLink(score, badgeName, missedIds) {
      if (!SCORE_FORM.url.startsWith("https://docs.google.com/forms/")) return "";
      const formLink = new URL(SCORE_FORM.url);
      const params = formLink.searchParams;
      params.set("usp", "pp_url");                      // tells Google "this is a prefilled link"
      const add = (entry, value) => {
        if (entry && entry !== "entry.0") params.set(entry, value);   // skip IDs not filled in yet
      };
      add(SCORE_FORM.nickname, settings.nickname);
      add(SCORE_FORM.score,    String(score));
      add(SCORE_FORM.badge,    badgeName);
      add(SCORE_FORM.missed,   missedIds.length ? missedIds.join(", ") : "none");
      if (settings.className) add(SCORE_FORM.class, settings.className);
      return formLink.toString();
    }

    // =====================================================
    // SPICE: hype words, streak, net, Phish Tank, final round
    // =====================================================
    const PUNS = ["NICE CATCH!", "FIN-TASTIC!", "JAWSOME!", "KRILL-IANT!", "WHALE DONE!",
                  "CLAM-AZING!", "O-FISH-ALLY AWESOME!", "SEA-RIOUSLY GOOD!", "SHELL-EBRATE!"];
    const pick = list => list[Math.floor(Math.random() * list.length)];

    // Big word pops up mid-screen, then floats away
    function hype(big, small, cool) {
      document.querySelectorAll(".hype").forEach(h => h.remove());   // one at a time
      const h = document.createElement("div");
      h.className = "hype" + (cool ? " cool" : "") + (calm() ? " calm" : "");
      h.setAttribute("aria-hidden", "true");
      const b = document.createElement("span");
      b.className = "big";
      b.textContent = big;
      h.append(b);
      if (small) {
        const sm = document.createElement("span");
        sm.className = "small";
        sm.textContent = small;
        h.append(sm);
      }
      document.body.append(h);
      setTimeout(() => h.remove(), 1500);
    }

    // 🔥 chip in the score pill (shows from 2 in a row)
    function showStreak() {
      const chip = $("#streak");
      chip.hidden = state.streak < 2;
      chip.textContent = "🔥" + state.streak;
      chip.classList.toggle("hot", state.streak >= 3);
    }

    // Drop a net over the sender's porthole
    function dropNet() {
      const holder = $("#sender");
      if (!holder) return;
      let lines = "";
      for (let i = -100; i <= 100; i += 14) {
        lines += `M${i} 0 L${i + 100} 100 M${i} 100 L${i + 100} 0 `;
      }
      holder.append(fromHTML(`
        <svg class="net" viewBox="0 0 100 100" aria-hidden="true">
          <defs><clipPath id="netClip"><circle cx="50" cy="50" r="46"/></clipPath></defs>
          <g clip-path="url(#netClip)" fill="none">
            <path d="${lines}" stroke="#16385a" stroke-width="4" opacity=".45"/>
            <path d="${lines}" stroke="#fff6dc" stroke-width="2"/>
          </g>
          <circle cx="50" cy="50" r="46" fill="none" stroke="#8b5a2b" stroke-width="5"/>
          <path d="M83 17 L104 -4" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round"/>
        </svg>
        <span class="caught-tag">CAUGHT!</span>`));
      Sound.play("net");
    }

    // Which phishers have been caught so far (right call on a phish)
    function caughtList() {
      return emails.filter((e, i) => e.isPhish && state.results[i] && state.results[i].correct && i < state.index);
    }

    // Build the Phish Tank. newId = a phisher that should "plop" in.
    function buildTank(newId) {
      const caught = caughtList();
      const tank = document.createElement("div");
      tank.className = "tank";
      tank.setAttribute("aria-label", `Phish Tank: ${caught.length} phishers caught`);
      const label = document.createElement("span");
      label.className = "tank-label";
      label.textContent = `🐟 Phish Tank: ${caught.length}`;
      tank.append(label);

      for (let b = 0; b < 4; b++) {
        const bub = document.createElement("span");
        bub.className = "tank-bubble";
        bub.style.left = (12 + b * 24) + "%";
        bub.style.animationDelay = (-b * .8) + "s";
        tank.append(bub);
      }

      if (!caught.length) {
        const empty = document.createElement("div");
        empty.className = "tank-empty";
        empty.textContent = "Catch phishers to fill your Phish Tank! 🎣";
        tank.append(empty);
      }

      caught.forEach((e, i) => {
        const f = document.createElement("div");
        f.className = "tank-fish" + (e.id === newId ? " new" : "");
        f.style.setProperty("--top", (14 + (i * 37) % 62) + "px");
        f.style.setProperty("--left", (3 + (i * 13) % 80) + "%");          // spread out (used for reduced motion)
        f.style.setProperty("--d", (9 + (i % 4) * 2.5) + "s");
        f.style.setProperty("--delay", (-i * 2.3) + "s");
        const pic = typeof makeCharacter === "function" ? makeCharacter(e.id) : null;
        if (pic) f.append(pic);
        else { f.textContent = e.avatar; f.style.fontSize = "44px"; }
        f.setAttribute("role", "button");
        f.tabIndex = 0;
        f.setAttribute("aria-label", "Tap a caught phisher");
        f.addEventListener("click", () => fishTalk(tank, f));
        f.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fishTalk(tank, f); } });
        tank.append(f);
      });
      return tank;
    }

    // 📖 A sticker card slides up when you find a NEW kind of trick
    function showTrickCard(id) {
      const t = TRICKS[id];
      document.querySelectorAll(".trick-card").forEach(c => c.remove());
      const card = document.createElement("div");
      card.className = "trick-card";
      card.setAttribute("role", "status");
      card.append(fromHTML(`<span class="t-icon" aria-hidden="true"></span>
        <span><span class="t-new">NEW TRICK UNLOCKED!</span><br><span class="t-name"></span><br><span class="t-tip"></span></span>`));
      $(".t-icon", card).textContent = t.icon;
      $(".t-name", card).textContent = t.name;
      $(".t-tip", card).textContent = t.tip;
      document.body.append(card);
      Sound.play("streak");
      setTimeout(() => { card.classList.add("out"); setTimeout(() => card.remove(), 400); }, 3200);
    }

    // The little row of trick badges (one per trick in tricks.js) under the Phish Tank
    function buildFieldGuideStrip() {
      const strip = document.createElement("div");
      strip.className = "fieldguide";
      const label = document.createElement("span");
      label.className = "fg-label";
      label.textContent = `📖 Field Guide ${state.tricks.filter(t => TRICK_ORDER.includes(t)).length}/${TRICK_ORDER.length}`;
      strip.append(label);
      TRICK_ORDER.forEach(id => {
        const t = TRICKS[id];
        const got = state.tricks.includes(id);
        const b = document.createElement("button");
        b.className = "fg-badge" + (got ? "" : " locked");
        b.textContent = got ? t.icon : "❔";
        b.setAttribute("aria-label", got ? t.name : "Locked trick");
        b.addEventListener("click", () => {
          Sound.play("pop");
          say(got ? `${t.icon} ${t.name}` : "❔ Still locked!",
              { text: got ? t.tip : "Find this kind of red flag in an email to unlock it.", kind: got ? "flag" : "" });
        });
        strip.append(b);
      });
      return strip;
    }

    // Caught phishers try one last scam when you tap them
    const TANK_LINES = [
      ["Let me out! I'll give you FREE coins!", "🎁 Too good to be true!"],
      ["Psst... what's your password?", "🔑 Never share it!"],
      ["Quick! Open the tank in 10 seconds!", "⏰ Nice try. No rushing!"],
      ["Don't tell your teacher about me...", "🤫 Secrets = red flag!"],
      ["I'm totally your best friend. Click here!", "🎭 Faker alert!"],
      ["Just send me a gift card code?", "💳 Nope!"]
    ];
    function fishTalk(tank, fish) {
      tank.querySelectorAll(".tank-talk").forEach(t => t.remove());
      const [line, answer] = pick(TANK_LINES);
      const bubble = document.createElement("div");
      bubble.className = "tank-talk";
      bubble.textContent = line;
      const small = document.createElement("small");
      small.textContent = answer;
      bubble.append(small);
      const tr = tank.getBoundingClientRect(), fr = fish.getBoundingClientRect();
      bubble.style.left = Math.max(8, Math.min(fr.left - tr.left, tr.width - 240)) + "px";
      bubble.style.top = Math.max(6, fr.top - tr.top - 40) + "px";
      tank.append(bubble);
      const svg = fish.querySelector(".cc");
      if (svg) characterReact(svg, "happy");
      Sound.play("blip");
      setTimeout(() => bubble.remove(), 2600);
    }

    // ⚡ Dramatic intro before the last email. Tap (or wait) to start.
    function finalRoundIntro(email) {
      document.body.classList.add("final-round");
      const o = document.createElement("div");
      o.className = "boss";
      o.setAttribute("role", "dialog");
      o.setAttribute("aria-label", "Final round");
      o.append(fromHTML(`
        <div>
          <div class="char b-char hero" id="bossChar"></div>
          <h2>⚡ FINAL ROUND ⚡</h2>
          <p>The last email in your Shell Mail. Read it like a detective and check EVERY letter!</p>
          <p class="tap">Tap to start</p>
        </div>`));
      putCharacter($("#bossChar", o), email.id, email.avatar, email.move);
      document.body.append(o);
      Sound.play("boss");
      let closed = false;
      const close = () => {
        if (closed) return;
        closed = true;
        o.classList.add("out");
        setTimeout(() => o.remove(), calm() ? 0 : 350);
      };
      o.addEventListener("click", close);
      setTimeout(close, 3200);
    }

    // =====================================================
    // SCREEN SWITCHING with a slide transition
    // =====================================================
    let switching = false;
    function go(render) {
      if (switching) return;
      const swap = () => {
        screen.classList.remove("leave", "enter");
        screen.replaceChildren();
        render(screen);
        void screen.offsetWidth;
        screen.classList.add("enter");
        window.scrollTo({ top: 0, behavior: calm() ? "auto" : "smooth" });
        screen.focus({ preventScroll: true });
        switching = false;
      };
      if (calm() || !screen.firstChild) { swap(); return; }
      switching = true;
      screen.classList.add("leave");
      setTimeout(swap, 250);
    }

    function guideHTML() {
      return `
        <section class="guide">
          <div class="char ollie" id="ollie"></div>
          <div class="bubble" aria-live="polite"><p class="say"></p><p class="why" hidden></p></div>
        </section>`;
    }

    // =====================================================
    // SCREEN 1: START
    // =====================================================
    function renderStart(root) {
      root.append(fromHTML(`
        <div class="card start">
          <div class="char hero" id="hero"></div>
          <h1 class="logo" id="logo" aria-label="Phish Finder"></h1>
          <p class="hello">Hi <b id="nick"></b>! I'm Ollie the Otter.<br>Sneaky emails are hiding in your Shell Mail. Can you catch them?</p>
          <ol class="how">
            <li><span class="ico">🤔</span> Read each email. Is it a <b>Phish</b> or <b>Safe</b>?</li>
            <li><span class="ico">🔍</span> Tap the sneaky parts to find red flags 🚩</li>
            <li><span class="ico">🏆</span> Earn points and win a badge!</li>
          </ol>
          <button class="btn glow" id="dive">🌊 Dive in!</button>
        </div>`));

      $("#nick", root).textContent = settings.nickname;
      putCharacter($("#hero", root), "ollie", GUIDE, "bounce");

      // Wavy title: one span per letter, each with a delay
      const logo = $("#logo", root);
      [..."Phish Finder"].forEach((ch, i) => {
        const s = document.createElement("span");
        s.textContent = ch === " " ? " " : ch;
        s.style.setProperty("--i", i);
        s.setAttribute("aria-hidden", "true");
        logo.append(s);
      });

      $("#dive", root).addEventListener("click", () => {
