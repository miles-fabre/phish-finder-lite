      });
    }

    // =====================================================
    // SCREEN 2: SHELL MAIL INBOX
    // =====================================================
    function renderInbox(root) {
      const left = emails.length - state.index;
      root.append(fromHTML(`
        <div class="card app">
          <div class="app-bar"><span>🐚 Shell Mail</span><span class="chip" id="unread"></span></div>
          <ul class="inbox" id="inbox"></ul>
        </div>
        ${guideHTML()}`));

      document.body.classList.remove("final-round");
      // The phisher from the email you just finished plops into the tank
      const prev = emails[state.index - 1];
      const justCaught = prev && prev.isPhish && state.results[state.index - 1] && state.results[state.index - 1].correct;
      root.prepend(buildTank(justCaught ? prev.id : null), buildFieldGuideStrip());
      if (justCaught) setTimeout(() => Sound.play("plop"), calm() ? 0 : 500);

      putCharacter($("#ollie", root), "ollie", GUIDE, "float");
      $("#unread", root).textContent = `${left} new`;
      const list = $("#inbox", root);

      emails.forEach((email, i) => {
        const li = document.createElement("li");
        const row = document.createElement("button");
        row.className = "row";
        row.append(fromHTML(`
          <span class="r-avatar" aria-hidden="true"></span>
          <span class="r-text"><span class="r-from"></span><span class="r-subject"></span></span>
          <span class="r-tag"></span>`));
        const pic = typeof makeCharacter === "function" ? makeCharacter(email.id) : null;
        if (pic) $(".r-avatar", row).append(pic);
        else $(".r-avatar", row).textContent = email.avatar;
        $(".r-from", row).textContent = plain(email.from).split("<")[0].trim() || plain(email.from);
        $(".r-subject", row).textContent = plain(email.subject);
        const tag = $(".r-tag", row);

        if (i < state.index) {                      // finished
          const r = state.results[i];
          row.classList.add("done");
          tag.textContent = (r.correct ? "⭐ +" : "🫧 +") + r.points;
          row.disabled = true;
        } else if (i === state.index) {             // the one to open now
          row.classList.add("current");
          tag.textContent = "NEW";
          row.addEventListener("click", () => {
            Sound.play("whoosh");
            go(renderEmail);
          });
        } else {                                    // still waiting
          row.classList.add("later");
          tag.textContent = "📩";
          row.disabled = true;
        }
        li.append(row);
        list.append(li);
      });

      const first = state.index === 0;
      say(first
        ? `You've got ${left} new Shell Mails! Tap the NEW one to open it.`
        : justCaught
          ? `Into the Phish Tank you go! 🐟 Now tap the NEW email.`
          : `Another email just washed in! Tap NEW to open it.`);

      Sound.play("mail");
      // Bring the NEW email into view (helpful on small screens)
      setTimeout(() => {
        const cur = $(".row.current", root);
        if (cur) cur.scrollIntoView({ block: "center", behavior: calm() ? "auto" : "smooth" });
      }, calm() ? 0 : 500);
    }

    // =====================================================
    // SCREEN 3: ONE EMAIL
    // =====================================================
    function renderEmail(root) {
      const email = currentEmail();
      state.found = [];
      state.emailPoints = 0;
      state.phase = "decide";

      root.append(fromHTML(`
        <article class="card app mail" id="mail">
          <div class="app-bar"><span>🐚 Shell Mail</span><span class="chip" id="count"></span></div>
          <div class="mail-inner">
            <div class="mail-head">
              <div class="char" id="sender"><div class="idle"></div></div>
              <div class="meta">
                <div class="meta-line"><span class="label">From</span><span class="from" id="from"></span></div>
                <div class="meta-line"><span class="label">To</span><span id="to"></span></div>
              </div>
            </div>
            <h2 class="subject" id="subject"></h2>
            <div class="mail-body" id="body"></div>
            <div id="buttonSlot"></div>
          </div>
        </article>
        ${guideHTML()}
        <div class="actions" id="actions"></div>`));

      $("#count", root).textContent = `Email ${state.index + 1} of ${emails.length}`;
      putCharacter($("#sender", root), email.id, email.avatar, email.move);
      putCharacter($("#ollie", root), "ollie", GUIDE, "float");
      $("#from", root).append(buildText(email.from));
      $("#to", root).textContent = settings.nickname;
      $("#subject", root).append(buildText(email.subject));
      $("#body", root).append(buildText(email.body));

      if (email.button) {
        const b = document.createElement("div");
        b.className = "mail-btn";
        b.append(buildText(email.button));
        $("#buttonSlot", root).append(b);
      }

      // Phish / Safe buttons
      $("#actions", root).append(fromHTML(`
        <div class="decide" id="decide">
          <button class="btn btn-phish" data-phish="1"><span class="big-emoji">🎣</span>Phish</button>
          <button class="btn btn-safe"  data-phish="0"><span class="big-emoji">✅</span>Safe</button>
        </div>`));
      root.querySelectorAll("#decide .btn").forEach(btn =>
        btn.addEventListener("click", () => decide(btn.dataset.phish === "1", btn)));

      say("Read it carefully. Is this email a Phish or Safe?");
      if (state.index === emails.length - 1) finalRoundIntro(email);
    }

    // ---------- STEP 1: PHISH OR SAFE ----------
    function decide(saidPhish, btn) {
      if (state.phase !== "decide") return;
      const email = currentEmail();
      const correct = saidPhish === email.isPhish;
      const ollie = $("#ollie"), sender = $("#sender"), mail = $("#mail");

      state.phase = "hunt";
      state.results[state.index] = { correct, points: 0 };
      sendToTeacher({ type: "answer", emailId: email.id, saidPhish });   // Phish/Safe call, for stats
      document.querySelectorAll("#decide .btn").forEach(b => b.disabled = true);

      // Slam the verdict stamp onto the email
      const stamp = document.createElement("div");
      stamp.className = "stamp " + (email.isPhish ? "phish" : "safe");
      stamp.textContent = email.isPhish ? "PHISH! 🎣" : "SAFE ✓";
      mail.classList.add("stamped");
      mail.append(stamp);
      Sound.play("stamp");

      if (correct) {
        state.streak++;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        hype(pick(PUNS), state.streak >= 3 ? `🔥 ${state.streak} IN A ROW!` : "");
        if (state.streak >= 3) setTimeout(() => Sound.play("streak"), 250);
        if (email.isPhish) {
          setTimeout(dropNet, calm() ? 0 : 300);
          sendToTeacher({ type: "catch", emailId: email.id, hard: email.id === HARD_ONE });
        }
        addPoints(10, btn);
        Sound.play("correct");
        burst(btn, ["⭐", "✨", "🫧", "🐟"], 16);
        mood(ollie, "happy");
        mood(sender, email.isPhish ? "oops" : "happy");      // phisher: busted! / safe sender: yay
        if (email.id === HARD_ONE) {
          state.caughtHardOne = true;
          setTimeout(() => {
            addPoints(10, $("#scorePill"), "+10 🦈 BONUS!");
            Sound.play("allFound");
            burst($("#scorePill"), ["🦈", "⭐"], 10);
          }, calm() ? 0 : 700);
        }
      } else {
        hype("OH, BUOY!", state.streak >= 2 ? "🫧 Streak popped!" : "Let's learn why 👇", true);
        if (state.streak >= 2) Sound.play("fizzle");
        state.streak = 0;
        Sound.play("wrong");
        mood(ollie, "oops");
        mood(sender, email.isPhish ? "happy" : "oops");      // the trickster grins / the real sender is sad
      }

      // Start the hunt: spots become tappable
      mail.classList.add("hunting");
      mail.querySelectorAll(".spot").forEach(s => s.tabIndex = 0);

      let msg;
      if (email.isPhish) {
        msg = correct ? "Nice catch! It IS a phish! 🎣 Now tap the sneaky parts."
                      : "Uh-oh! This one is a phish. Let's find the sneaky parts!";
      } else {
        msg = correct ? "Yes! This one is safe! ✅ Tap around to see why."
                      : "Not quite! This one is actually safe. Tap around to see why.";
      }
      if (correct && state.streak >= 2) msg += ` 🔥 ${state.streak} in a row!`;
      showStreak();
      if (correct && email.id === HARD_ONE) msg = "WOW, sharp eyes! 🦈 That was the trickiest one! +10 bonus! Now tap the sneaky parts.";
      say(msg);

      // Red flag counter + "I'm done" button
      const actions = $("#actions");
      actions.replaceChildren();
      if (email.isPhish) {
        const pips = document.createElement("div");
        pips.className = "pips";
        pips.id = "pips";
        pips.setAttribute("aria-label", `0 of ${flagCount(email)} red flags found`);
        for (let i = 0; i < flagCount(email); i++) {
          const p = document.createElement("span");
          p.className = "off";
          p.textContent = "🚩";
          pips.append(p);
        }
        actions.append(pips);
      }
      const done = document.createElement("button");
      done.className = "btn";
      done.id = "doneBtn";
      done.textContent = "I'm done ✋";
      done.addEventListener("click", finishEmail);
      actions.append(done);
    }

    // ---------- STEP 2: TAP THE SPOTS ----------
    function tapSpot(span) {
      const email = currentEmail();
      const key = span.dataset.key;
      const spot = email.spots[key];

      if (state.phase === "decide") {          // too early!
        say("First choose: Phish or Safe? 👇");
        $("#decide").classList.remove("nudge");
        void $("#decide").offsetWidth;
        $("#decide").classList.add("nudge");
        return;
      }
      if (!spot) { console.warn("No spot found for:", key); return; }

      const tip = { text: fill(spot.why), kind: spot.flag ? "flag" : "fine" };

      // After "I'm done": just explain, no points
      if (state.phase === "review") {
        Sound.play("pop");
        say(spot.flag ? "🚩 That's a red flag!" : "👍 That part is fine.", tip);
        return;
      }

      // Hunting
      const isNew = !state.found.includes(key);
      if (isNew) state.found.push(key);

      if (!spot.flag) {
        span.classList.add("is-fine");
        Sound.play("blip");
        say("👍 That part is fine. No trick here!", tip);
        return;
      }

      span.classList.add("is-flag");
      if (!isNew) { Sound.play("pop"); say("🚩 You already found this one!", tip); return; }

      addPoints(5, span);
      Sound.play("flag");
      const trick = trickFor(key);
      if (!state.tricks.includes(trick)) {
        state.tricks.push(trick);
        if (trick !== "other") setTimeout(() => showTrickCard(trick), calm() ? 0 : 500);
      }
      burst(span, ["🚩", "✨"], 8);
      mood($("#sender"), "oops");                            // caught!
      const card = $("#mail");
      if (!calm()) { card.classList.remove("jolt"); void card.offsetWidth; card.classList.add("jolt"); }
      react($("#ollie"), "hop");

      // Light up the next pip
      const got = flagsFound(email), total = flagCount(email);
      const pips = $("#pips");
      if (pips) {
        const pip = pips.children[got - 1];
        if (pip) pip.className = "on";
        pips.setAttribute("aria-label", `${got} of ${total} red flags found`);
      }

      if (got === total) {
        say(`🎉 You found ALL ${total} red flags!`, tip);
        setTimeout(() => hype("FLAWLESS!", "🚩 Every red flag found"), calm() ? 0 : 350);
        setTimeout(() => {
          Sound.play("allFound");
          mood($("#ollie"), "happy");
          burst($("#doneBtn"), ["🎉", "⭐", "🐠", "🫧"], 18);
        }, calm() ? 0 : 350);
        $("#doneBtn").classList.add("glow");
      } else {
        say(`🚩 Red flag! +5   (${got} of ${total} found)`, tip);
      }
    }

    // One listener for every spot (this is called "event delegation")
    screen.addEventListener("click", e => {
      const span = e.target.closest(".spot");
      if (span) tapSpot(span);
    });
    screen.addEventListener("keydown", e => {
      const span = e.target.closest(".spot");
      if (span && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tapSpot(span); }
    });

    // ---------- STEP 3: REVIEW + NEXT ----------
    function finishEmail() {
      if (state.phase !== "hunt") return;
      const email = currentEmail();
      state.phase = "review";

      // Circle any red flags they missed
      let missed = 0;
      const missedKeys = [];
      document.querySelectorAll("#mail .spot").forEach(span => {
        const spot = email.spots[span.dataset.key];
        if (spot && spot.flag && !state.found.includes(span.dataset.key)) {
          span.classList.add("is-missed");
          missed++;
          missedKeys.push(span.dataset.key);
        }
      });

      // Save this email's result
      const result = state.results[state.index];
      result.points = state.emailPoints;
      result.flags = flagsFound(email);
      const foundKeys = state.found.filter(k => email.spots[k] && email.spots[k].flag);
      if (foundKeys.length || missedKeys.length) {
        sendToTeacher({ type: "flags", emailId: email.id, count: foundKeys.length, found: foundKeys, missed: missedKeys });
      }
      showProgress();

      let msg;
      if (missed > 0) {
        msg = `You missed ${missed} red flag${missed > 1 ? "s" : ""}. They're blinking now. Tap them to learn why!`;
        Sound.play("pop");
      } else if (email.isPhish) {
        msg = "You found every red flag! 🐟 Super sleuthing!";
        mood($("#ollie"), "happy");
        Sound.play("correct");
      } else {
        msg = "Great checking! Safe emails don't rush you or ask for secrets.";
        mood($("#ollie"), "happy");
        Sound.play("correct");
      }
      say(msg);

      const last = state.index === emails.length - 1;
      const actions = $("#actions");
      actions.replaceChildren();
      const next = document.createElement("button");
      next.className = "btn glow";
      next.textContent = last ? "See my score 🏆" : "Back to inbox ➜";
      next.addEventListener("click", () => {
        Sound.play("whoosh");
        state.index++;
        go(last ? renderEnd : renderInbox);
      });
      actions.append(next);
    }

    // =====================================================
    // SCREEN 4: THE END
    // =====================================================
    function maxScore() {
      // 10 per email + 5 per red flag + 10 bonus for the hard one
      let max = 10;
      emails.forEach(e => { max += 10 + flagCount(e) * 5; });
      return max;
    }

    function renderEnd(root) {
      state.phase = "end";
      const max = maxScore();
      const pct = state.score / max;
      const badge = pct >= 0.8
        ? { icon: "🕵️", name: "Phish Detective" }
        : { icon: "🐟", name: "Phish Finder in Training" };

      const rightCalls = state.results.filter(r => r.correct).length;
      const flagsGot = state.results.reduce((sum, r) => sum + (r.flags || 0), 0);
      const flagsAll = emails.reduce((sum, e) => sum + flagCount(e), 0);

      root.append(fromHTML(`
        <div class="card end">
          <div class="char hero" id="hero"></div>
          <h1>You did it, <span id="nick"></span>!</h1>
          <div class="medal" aria-hidden="true" id="medal"></div>
          <h2 class="badge-name" id="badgeName"></h2>
          <p class="final"><span id="finalScore">0</span> / ${max} points</p>
          <div class="stats">
            <div class="stat">✅ Right calls<b>${rightCalls} / ${emails.length}</b></div>
            <div class="stat">🚩 Red flags found<b>${flagsGot} / ${flagsAll}</b></div>
            <div class="stat">🔥 Best streak<b>${state.bestStreak}</b></div>
          </div>
          <h2 class="guide-title" id="guideTitle"></h2>
          <div class="guide-cards" id="guideCards"></div>
          <div id="endTank"></div>
          <div class="shark" id="shark" hidden>
            <span class="big">🦈</span>
            <span><b>Sharp-Eyed Shark badge!</b><br>You caught the trickiest email. +10 bonus!</span>
          </div>
          <p class="remember">Remember: 🛑 Stop. 🔍 Check. 🙋 Ask a grown-up.</p>
          <div class="actions" id="sendWrap" hidden>
            <a class="btn send-score" id="sendScore" target="_blank" rel="noopener noreferrer">📨 Send my score to my teacher</a>
          </div>
          <div class="actions"><button class="btn glow" id="again">🔁 Play again</button></div>
        </div>`));

      // The IDs of emails they called wrong (Phish vs Safe), like "lunch-safe, the-hard-one"
      const missedIds = emails.filter((e, i) => state.results[i] && !state.results[i].correct).map(e => e.id);
      const formHref = scoreFormLink(state.score, badge.name, missedIds);
      if (formHref) {
        const send = $("#sendScore", root);
        send.href = formHref;
        $("#sendWrap", root).hidden = false;
        send.addEventListener("click", () => Sound.play("pop"));
      }

      $("#nick", root).textContent = settings.nickname;
      $("#medal", root).textContent = badge.icon;
      $("#badgeName", root).textContent = badge.name;
      putCharacter($("#hero", root), "ollie", GUIDE, "bounce");
      setTimeout(() => mood($("#hero", root), "happy"), 400);
      $("#shark", root).hidden = !state.caughtHardOne;
      document.body.classList.remove("final-round");
      $("#endTank", root).append(buildTank(null));
      const gotCount = TRICK_ORDER.filter(id => state.tricks.includes(id)).length;
      $("#guideTitle", root).textContent = `📖 Your Field Guide: ${gotCount} / ${TRICK_ORDER.length} tricks`;
      TRICK_ORDER.forEach(id => {
        const t = TRICKS[id], got = state.tricks.includes(id);
        const c = document.createElement("div");
        c.className = "g-card" + (got ? "" : " locked");
        c.append(fromHTML(`<div class="g-top"><span aria-hidden="true"></span><span></span></div><p></p>`));
        c.querySelector(".g-top span:first-child").textContent = got ? t.icon : "❔";
        c.querySelector(".g-top span:last-child").textContent = got ? t.name : "Locked";
        c.querySelector("p").textContent = got ? t.tip : "You'll spot this one next time!";
        $("#guideCards", root).append(c);
      });

      // Count the final score up for drama
      const out = $("#finalScore", root);
      if (calm()) out.textContent = state.score;
      else {
        const t0 = performance.now();
        const step = now => {
          const k = Math.max(0, Math.min(1, (now - t0) / 1400));
          out.textContent = Math.round(state.score * (1 - Math.pow(1 - k, 3)));
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      Sound.play("fanfare");
      confettiRain();

      sendToTeacher({ type: "finish", score: state.score, badge: badge.name });

      $("#again", root).addEventListener("click", () => {
        Object.assign(state, { index: 0, score: 0, phase: "start", found: [], emailPoints: 0, results: [], caughtHardOne: false, streak: 0, bestStreak: 0, tricks: [] });
        showStreak();
        sendToTeacher({ type: "join" });
        shownScore = 0;
        scoreEl.textContent = "0";
        showProgress();
        Sound.play("whoosh");
        go(renderInbox);
      });
    }

    // =====================================================
    // START UP
    // =====================================================

    // Floating background bubbles (skipped for reduced motion)
    if (!calm()) {
      const holder = $("#bubbles");
      for (let i = 0; i < 14; i++) {
        const b = document.createElement("span");
        b.className = "bg-bubble";
        b.style.setProperty("--x", Math.random() * 100 + "%");
        b.style.setProperty("--s", 10 + Math.random() * 26 + "px");
        b.style.setProperty("--d", 9 + Math.random() * 10 + "s");
        b.style.setProperty("--delay", -Math.random() * 18 + "s");
        holder.append(b);
      }
    }

    // Helper for you, the game maker: warns in the console if an email has
    // a [[spot]] with no matching key in spots (a typo would break tapping).
    emails.forEach(e => {
      const text = [e.from, e.subject, e.body, e.button].join(" ");
      for (const m of text.matchAll(/\[\[(.+?)\]\]/g)) {
        if (!e.spots[m[1]]) console.warn(`Email "${e.id}": no spot for [[${m[1]}]]`);
      }
    });

    // No class to connect to: start right away.
    showProgress();
    go(renderStart);
  </script>
</body>
</html>
